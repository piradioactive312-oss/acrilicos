<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload de Fotos — Acrílicos & Cia</title>
<link rel="stylesheet" href="style.css">
<style>
  .size-chip {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 16px;
  }
  .size-chip__icon {
    width: 40px; height: 40px; border-radius: 11px; background: var(--blue-soft);
    display: flex; align-items: center; justify-content: center; font-size: 10px;
    font-weight: 800; color: var(--navy); flex-shrink: 0;
  }
  .size-chip__body { flex: 1; }
  .size-chip__name { font-weight: 700; font-size: 14.5px; }
  .size-chip__price { font-size: 12px; color: var(--muted); }
  .size-chip__swap { font-size: 12.5px; color: var(--blue); font-weight: 600; display: flex; align-items: center; gap: 5px; background: none; border: none; cursor: pointer; }

  .dropzone {
    background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow);
    padding: 34px 20px 28px; text-align: center; margin-bottom: 20px;
    background: linear-gradient(180deg, #e9f0fd 0%, #ffffff 65%);
  }
  .dropzone__icon {
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(150deg, #2c66d6 0%, var(--navy) 100%);
    box-shadow: 0 8px 18px rgba(26, 86, 219, 0.28);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    position: relative;
  }
  .dropzone__icon svg { width: 26px; height: 26px; color: #fff; }
  .dropzone__badge {
    position: absolute; bottom: -6px; right: -6px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--card);
  }
  .dropzone__badge svg { width: 11px; height: 11px; color: #fff; }
  .dropzone p { font-size: 13.5px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }

  .queue-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .queue-head h2 { font-size: 15px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
  .queue-count {
    background: var(--blue-soft); color: var(--navy); font-size: 12px; font-weight: 800;
    border-radius: 999px; padding: 2px 9px;
  }
  .queue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .photo-card {
    background: var(--card); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow);
  }
  .photo-card__img-wrap { position: relative; aspect-ratio: 1/1; background: #eef2f9; }
  .photo-card__img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-card__remove {
    position: absolute; top: 7px; right: 7px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(20,26,38,0.55); border: none; color: #fff; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .photo-card__remove svg { width: 12px; height: 12px; }
  .photo-card__rotate {
    position: absolute; bottom: 7px; right: 7px; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; border: none; color: var(--navy); display: flex; align-items: center;
    justify-content: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .photo-card__rotate svg { width: 13px; height: 13px; }
  .photo-card__qty { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; }
  .qty-btn {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: #fff;
    color: var(--navy); font-size: 16px; font-weight: 700; cursor: pointer; display: flex;
    align-items: center; justify-content: center; line-height: 1;
  }
  .qty-val { font-weight: 700; font-size: 13.5px; }

  .empty-hint { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 0; }

  .bottom-bar__row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .bottom-bar__total { }
  .bottom-bar__total-label { font-size: 11.5px; color: var(--muted); }
  .bottom-bar__total-value { font-size: 17px; font-weight: 800; color: var(--green); }
  .bottom-bar .btn-primary { width: auto; padding: 14px 20px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="screen">
  <header class="topbar">
    <div class="topbar__icon">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 012-2h1.5l1-1.5h7l1 1.5H18a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="#fff" stroke-width="1.8"/></svg>
    </div>
    <div>
      <div class="topbar__title">Acrílicos &amp; Cia</div>
      <div class="topbar__subtitle">Revelação &amp; Impressão Rápida</div>
    </div>
  </header>

  <nav class="stepper" aria-label="Progresso do pedido">
    <div class="step-dot done"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 7.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="step-dash done"></div>
    <div class="step-pill"><span class="step-dot">2</span>Upload</div>
    <div class="step-dash"></div>
    <div class="step-dot">3</div>
    <div class="step-dash"></div>
    <div class="step-dot far">4</div>
  </nav>

  <main class="content">
    <div class="size-chip" id="sizeChip"></div>

    <div class="dropzone">
      <div class="dropzone__icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 6l1-2h6l1 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="dropzone__badge">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.4" fill="currentColor"/><path d="M4 16l4-4a1.4 1.4 0 012 0L14 16" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
      </div>
      <p>Toque para escolher da galeria ou tirar novas fotos na hora.</p>
      <button class="btn btn-primary" id="pickBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        Selecionar Fotos do Celular
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple capture="environment" hidden>
    </div>

    <div class="queue-head">
      <h2>Fotos na Fila <span class="queue-count" id="queueCount">0</span></h2>
    </div>

    <div class="queue-grid" id="queueGrid"></div>
    <p class="empty-hint" id="emptyHint">Nenhuma foto adicionada ainda.</p>
  </main>

  <div class="bottom-bar">
    <div class="bottom-bar__row">
      <div class="bottom-bar__total">
        <div class="bottom-bar__total-label" id="totalLabel">0 fotos no total</div>
        <div class="bottom-bar__total-value" id="totalValue">R$ 0,00</div>
      </div>
      <button class="btn btn-primary" id="nextBtn" type="button" disabled>
        Editar &amp; Legendas
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  let size = AC.getSize();
  if (!size) { size = SIZES.find(s => s.id === '7x10'); AC.setSize(size); }

  document.getElementById('sizeChip').innerHTML = `
    <div class="size-chip__icon">${size.name.length > 6 ? size.name.slice(0,5) : size.name}</div>
    <div class="size-chip__body">
      <div class="size-chip__name">${size.name} ${size.desc.split(' ').slice(0,1).join('')}</div>
      <div class="size-chip__price">${AC.fmt(size.price)}/un</div>
    </div>
    <button class="size-chip__swap" id="swapBtn" type="button">
      Trocar
      <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M4 7h13M17 7l-3-3M20 17H7M7 17l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  `;
  document.getElementById('swapBtn').addEventListener('click', () => AC.goto('1-tamanho.html'));

  let queue = AC.getQueue();

  function render() {
    const grid = document.getElementById('queueGrid');
    const empty = document.getElementById('emptyHint');
    const count = queue.length;
    document.getElementById('queueCount').textContent = count;

    if (count === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      grid.innerHTML = queue.map((p, i) => `
        <div class="photo-card" data-i="${i}">
          <div class="photo-card__img-wrap">
            <img src="${p.dataURL}" style="transform: rotate(${p.rotation||0}deg)" alt="Foto ${i+1}">
            <button class="photo-card__remove" data-action="remove"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button>
            <button class="photo-card__rotate" data-action="rotate"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4v5h5M20 20v-5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 15A8 8 0 1019 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          </div>
          <div class="photo-card__qty">
            <button class="qty-btn" data-action="dec">−</button>
            <span class="qty-val">${p.qty} un</span>
            <button class="qty-btn" data-action="inc">+</button>
          </div>
        </div>
      `).join('');
    }

    const totalPhotos = queue.reduce((s, p) => s + p.qty, 0);
    const totalPrice = totalPhotos * size.price;
    document.getElementById('totalLabel').textContent = `${totalPhotos} foto${totalPhotos===1?'':'s'} no total`;
    document.getElementById('totalValue').textContent = AC.fmt(totalPrice);
    document.getElementById('nextBtn').disabled = count === 0;

    if (!AC.setQueue(queue)) {
      alert('O armazenamento do navegador está cheio. Remova alguma foto ou libere espaço para continuar.');
    }
  }

  document.getElementById('pickBtn').addEventListener('click', () => document.getElementById('fileInput').click());

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    let pending = files.length;
    if (!pending) return;
    files.forEach(file => {
      AC.resizeImage(file)
        .then((dataURL) => {
          queue.push({ id: AC.uid(), dataURL, qty: 1, rotation: 0, caption: '', font: 'Cursiva', color: '#14315c', filter: 'Normal' });
        })
        .catch((err) => {
          console.error('Erro ao processar foto:', err);
          alert('Não foi possível processar uma das fotos. Tente novamente.');
        })
        .finally(() => {
          pending--;
          if (pending === 0) render();
        });
    });
    e.target.value = '';
  });

  document.getElementById('queueGrid').addEventListener('click', (e) => {
    const card = e.target.closest('.photo-card');
    const btn = e.target.closest('[data-action]');
    if (!card || !btn) return;
    const i = Number(card.dataset.i);
    const action = btn.dataset.action;
    if (action === 'remove') queue.splice(i, 1);
    if (action === 'inc') queue[i].qty++;
    if (action === 'dec') queue[i].qty = Math.max(1, queue[i].qty - 1);
    if (action === 'rotate') queue[i].rotation = ((queue[i].rotation || 0) + 90) % 360;
    render();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (queue.length === 0) return;
    AC.setQueue(queue);
    AC.goto('3-editar.html');
  });

  render();
</script>
</body>
</html>
